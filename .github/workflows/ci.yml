name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # spirv-tools is what makes the `spv_validate` test a validation gate rather than a
      # recompile smoke test. It is on no GitHub runner image, and this workflow never installed
      # it, so that test reported "PASS (recompiled; spirv-val not found)" with status 0 on every
      # CI run it has ever had — while CLAUDE.md and both READMEs described prosper's shaders as
      # strictly spirv-val-gated. #1711 is what shipped through the gap. spv_validate now fails
      # when the validator is absent, so removing this line breaks the job instead of silently
      # switching the gate off again.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libavformat-dev libavcodec-dev \
            libavutil-dev libswresample-dev libswscale-dev libva-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools

      # #1675: Vulkan was disabled here because it was never installed, not by choice — and that
      # silently removed 27 tests (~1,700 assertions) from every "green" CI run, including every
      # shader-recompiler and GPU-execution differential. They are designed for a software device
      # (llvmpipe/lavapipe) and run in seconds locally, so CI can run them too.
      - name: Configure
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # A configuration that quietly loses Vulkan would silently drop those tests again and still
      # report 100% green. Fail the job instead of shrinking the suite.
      # Guard the CLASS, not the instance: a configure that quietly loses Vulkan would drop the GPU
      # suite again and still report 100% green, which is precisely the defect #1675 documents.
      #
      # By NAME, not by count. A "at least N tests" floor rots silently — the suite only grows, so a
      # threshold that is meaningful today is passed by the non-GPU tests alone once enough are added,
      # and the guard stops guarding without ever failing. These three cannot exist unless Vulkan was
      # found, and they stay meaningful however large the suite gets.
      - name: Verify the Vulkan-gated tests are actually registered
        run: |
          for t in rdna2_to_spirv_exec gpu_execute vulkan_triangle_render game_compute_exec; do
            if ! ctest --test-dir prosper/build-ci -N -R "^${t}$" | grep -q "Test *#"; then
              echo "::error::${t} is not registered — the Vulkan-gated suite is missing (see #1675)"
              exit 1
            fi
          done
          echo "Vulkan-gated suite present; total registered: \
            $(ctest --test-dir prosper/build-ci -N | tail -1 | grep -oE '[0-9]+$')"

      - name: Build
        run: cmake --build prosper/build-ci

      # The runner has no GPU, so this is Mesa's lavapipe software rasteriser. Four tests were once
      # excluded here as "driver-divergent" (#1681). NONE of them were: every divergence was
      # measured, and each time it was prosper's own assertion or fixture that overreached.
      #   * recompiled_fragment_render (6) / recompiled_shaders_render (1) asserted rendered pixels
      #     from draws whose shaders require an exact 64-lane fragment subgroup. lavapipe is fixed at
      #     8, so the backend correctly skips those draws fail-visibly and the target keeps its clear
      #     colour. Neighbouring assertions in the same files already gated on that capability; these
      #     did not. Now gated — both run and pass here.
      #   * game_compute_exec's R11G11B10 sweep required bit-exact round-tripping over all 2048 f11
      #     codes, which includes the NaN encodings. Exactly 92 texels differ, all 92 carrying a
      #     signalling NaN and none all-finite: NaN payload quieting through the f16->f32 unpack,
      #     which no driver owes us. Narrowed to bit-exactness for every finite and infinite code
      #     plus NaN-ness for the rest; this runner now reports `nan-payload-only=92 real=0`.
      #   * game_compute_exec's last two failures (#1690) looked version-specific — they failed only
      #     on Mesa 25.2.8 and passed on Mesa 26.1.4 lavapipe and on RADV — but no driver was at
      #     fault. The test's `image_copy_3d` fixture prepared a third address register and called
      #     itself 3D while leaving MIMG.DIM at 2D, so the recompiler faithfully emitted a 2D SPIR-V
      #     image addressed by two coordinates while the backend bound the 3D view its 3D resource
      #     descriptor calls for. A 3D view bound to a descriptor whose shader declares Dim 2D is
      #     undefined in Vulkan: Mesa 26.1.4 and RADV returned the data anyway, Mesa 25.2.8 returned
      #     zero. Encoding DIM=3D makes the fixture exercise the 3D path it always claimed to, and it
      #     passes on all three. A standalone Vulkan probe — a 3D storage image seeded from a host
      #     buffer, partially written by a compute dispatch, read back, with no prosper code in the
      #     path — passes on Mesa 25.2.8, which is what ruled the driver out.
      #
      # The exclusion list is now EMPTY, and it should stay that way. Excluding a test by name here
      # drops it from every future green run and the loss is invisible in the result — #1675 lost 27
      # tests to exactly that for months. If a GPU test fails here, diagnose it: all four exclusions
      # that ever existed turned out to be an assertion or a fixture that overreached, and not one of
      # them turned out to be the driver.
      #
      # Reproduce the software-rasteriser path locally with:
      #   VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json ctest
      # To reproduce THIS runner's exact driver, note that the Mesa here comes from the Ubuntu
      # archive at run time rather than from a pin. It is currently 25.2.8, which both Ubuntu 24.04
      # and 25.10 carry, so a CPU-only container reproduces it without a GPU:
      #   podman run --rm -v "$PWD:/work" ubuntu:25.10   # mesa-vulkan-drivers 25.2.8
      - name: Test
        run: |
          ctest --test-dir prosper/build-ci --output-on-failure --timeout 600

      # #1704: until this step existed, no Vulkan validation layer ran anywhere in the project.
      # #1690 was an invalid descriptor binding — a VK_IMAGE_VIEW_TYPE_3D view on a descriptor whose
      # module declared Dim 2D — which is undefined behaviour that three conformant drivers resolved
      # three different ways. It read as a Mesa version regression, cost a session of bisection and
      # 484 executed assertions' place on this job, and the layer names it in one line at the
      # dispatch (VUID-vkCmdDispatch-viewType-07752). Verified against that exact defect: reverting
      # image_copy_3d's MIMG.DIM to 2D on a scratch branch makes this step fail with that VUID.
      #
      # It is a GATE, not an advisory collector. Every message id that existed when it was switched
      # on is itemised in tools/vkval/allowlist.txt with a reason and an open issue (#1710-#1717);
      # anything else fails the job, as does any test that fails under the layer but passes without
      # it. The scanner refuses to report "clean" until it has watched the loader insert the layer,
      # because a layer that did not load produces exactly the same empty output as a clean run —
      # and it also fails if the allow-list is non-empty while ZERO messages were observed, which is
      # what a parser that no longer matches this runner's layer version looks like. That is not
      # hypothetical: the first revision of the parser read 0 of the 187 messages produced here,
      # because layers 1.3.275 frame a message differently from 1.4.341.
      #
      # Measured cost on this runner: ctest reports 30.46 s without the layer and 31.08 s with it,
      # so this step is ~31 s of wall clock. The layer package lives in noble/universe.
      - name: Vulkan validation scan
        run: |
          python3 prosper/tools/vkval/vk_validation_scan.py --build-dir prosper/build-ci

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Its own job rather than a step of Linux: a false positive here must not cost the build and
      # test signal from an unrelated job. It needs nothing built and finishes in seconds.
      #
      # The instrument-trap table is the page the working guide points agents at first, and several
      # lanes append to it concurrently. Two defects landed in it on 2026-08-01 that NO other check
      # in this pipeline could see:
      #   * A stray blank line between two rows. Markdown ends a table at a blank line, so the rows
      #     after it silently render as a SEPARATE table. Master carried two at once, rendering 36
      #     rows as three tables with the newest entry orphaned in a one-row table of its own.
      #     Nothing is missing from the file, so the diff looks perfect.
      #   * Two branches claiming the same row number. These merge CLEANLY -- separate lines, no
      #     textual conflict -- producing a table reading "33, 34, 35, 32" at mergeable=CLEAN with
      #     every job green. Conflict detection is line-local and has no idea the column is a key,
      #     and other documents cite these rows BY NUMBER, so a duplicate silently redirects them.
      #
      # --sequential is opt-in and belongs only to this table, whose convention is "append, never
      # renumber". Measured with this checker over the 77 tracked Markdown files: all 77 pass the
      # structure check, while of the 5 documents holding an all-numeric-first-column table only 2
      # satisfy sequence -- the rest lead with frame indices, draw ordinals and submit numbers,
      # where gaps and repeats are the correct content. Applying sequence broadly would report
      # correct documents as broken, and a check that fires on correct data gets deleted.
      - name: Verify the numbered doc tables are intact
        run: |
          python3 prosper/tools/docs/check_numbered_table.py --github --sequential \
            --table-header Instrument prosper/docs/GAME_COMPAT_ORCHESTRATION.md

      # Structure and cell ARITY, across every tracked Markdown file: catches the same
      # table-splitting defect anywhere it appears, plus a third class no gate here could see
      # before (#2108). GFM splits a row into cells on `|` BEFORE parsing inline content, so a pipe
      # inside an inline code span is a cell boundary and the excess cells are SILENTLY DISCARDED
      # on the rendered page. Six rows of the instrument-trap table were truncated this way for
      # months -- including trap 40, whose subject is `cmd | tail` and which was broken by writing
      # exactly that unescaped -- while the step above reported the file `unbroken`, because it
      # validates numbering contiguity and never cell counts. The fix per row is one character,
      # `\|`. Documents with no table at all are ordinary here and are not an error.
      - name: Verify no Markdown table is split or mis-sized anywhere in docs
        run: |
          git ls-files '*.md' -z | xargs -0 python3 prosper/tools/docs/check_numbered_table.py --github

  linux-app:
    name: Linux App
    runs-on: ubuntu-latest

    # Builds the desktop frontend (prosper-app) with the SDL3 audio + gamepad frontends and Vulkan,
    # so the windowing/present/boot glue and the frontends stay compiling. Build-only: the app opens a
    # window and needs a display, so it isn't run here (the headless core is covered by the `linux` job).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # Vulkan (loader + FindVulkan) for the renderer; Wayland/X11 dev libs so the fetched SDL3
        # builds its video backends; PulseAudio/ALSA for the SDL3 audio backend. SDL3 itself is
        # fetched + built by CMake (FetchContent), so no libsdl package is needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev \
            libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libpulse-dev libasound2-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libva-dev

      - name: Configure
        run: cmake -S prosper -B prosper/build-app -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPROSPER_APP=ON -DPROSPER_AUDIO_SDL3=ON -DPROSPER_PAD_SDL3=ON

      - name: Build prosper-app
        # Building this target also builds its deps: prosper_core, prosper_live_renderer, SDL3, and
        # the prosper_audio_sdl3 / prosper_pad_sdl3 frontends.
        run: cmake --build prosper/build-app --target prosper-app

  linux-app-package:
    name: Linux App Package
    # PINNED, deliberately not ubuntu-latest. No AppImage bundles libc, so this runner's glibc is
    # the minimum every user of the published artifact must have, and `ubuntu-latest` silently
    # follows the newest image -- it would raise that floor on some future Tuesday with no diff and
    # no failing check. ubuntu-22.04 would give a lower floor (2.35), but the Ubuntu 22 images begin
    # brownout-based deprecation on 2026-09-17 and are unsupported from 2027-04-17, so pinning them
    # buys six weeks and then starts failing builds. 24.04 is the oldest runner that is not about to
    # break; verify-linux-app.sh asserts the resulting floor (2.39) so it cannot drift silently.
    runs-on: ubuntu-24.04

    # Separate from `Linux App` on purpose. That job stays Debug and build-only, which is the cheap
    # compile signal for the frontends; this one is the release path -- Release build, real
    # packaging, and the artifact checks. Losing either would be invisible in the other's result.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # The build set is identical to the Linux App job: the packaged binary must be the one that
        # job compiles, not a differently-configured build that happens to be easier to bundle.
        # The last line is the packaging set -- desktop-file-utils because appimagetool validates the
        # .desktop entry, file and binutils because the verification reads the artifacts back.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev \
            libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libpulse-dev libasound2-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libva-dev \
            desktop-file-utils file binutils

      - name: Configure
        run: >-
          cmake -S prosper -B prosper/build-release-app -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPROSPER_APP=ON
          -DPROSPER_AUDIO_SDL3=ON
          -DPROSPER_PAD_SDL3=ON

      - name: Build prosper-app
        run: cmake --build prosper/build-release-app --target prosper-app

      # Packaging runs on EVERY pull request, not only on tags. #1462 removed the Windows
      # package+upload from PRs because `actions/upload-artifact` hung and blocked a merge; the
      # problem there was the upload, not the packaging. Only the upload below is gated, so the
      # release path is exercised continuously while ordinary PRs still produce no artifacts.
      - name: Package Linux app
        # A block scalar, not a folded one: the two BUILD.txt lines must stay two lines.
        run: |
          info="commit: ${{ github.sha }}
          workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          prosper/packaging/linux/package-linux-app.sh \
            --build-dir prosper/build-release-app \
            --out-dir "$RUNNER_TEMP/linux-release" \
            --build-info "$info"

      # The gate that makes the step above worth running on PRs: the archives are extracted and the
      # packaged binary is executed, so "the release archive does not start" fails here instead of
      # in a user's download.
      - name: Verify Linux release artifacts
        run: >-
          prosper/packaging/linux/verify-linux-app.sh
          --out-dir "$RUNNER_TEMP/linux-release"
          --max-glibc 2.39

      # Archives leave the runner only for a release tag. Pull requests still build, package, and
      # execute the archives above, but never upload them (#1803).
      - name: Upload Linux archives
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: prosper-linux-x86_64
          path: |
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.AppImage
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.AppImage.sha256
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.tar.gz
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-mingw:
    name: Windows MinGW
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # spirv-tools: the `spv_validate` test runs on every platform and requires spirv-val
          # (see the Linux job's dependency note).
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-spirv-tools

      - name: Configure
        shell: msys2 {0}
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE

      - name: Build
        shell: msys2 {0}
        run: cmake --build prosper/build-ci

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir prosper/build-ci --output-on-failure --timeout 600

  windows-app:
    name: Windows App
    runs-on: windows-latest

    # Build-only for the Vulkan window itself: hosted Windows runners do not expose a reliable GPU
    # or interactive desktop. The SDL audio/pad seams still run through their dummy-driver tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Configure frontend
        shell: msys2 {0}
        run: >-
          cmake -S prosper -B prosper/build-windows-app -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPROSPER_APP=ON
          -DPROSPER_AUDIO_SDL3=ON
          -DPROSPER_PAD_SDL3=ON

      - name: Build frontend and seam tests
        shell: msys2 {0}
        run: >-
          cmake --build prosper/build-windows-app
          --target prosper-app test_prosper_app_pad_overlay test_audio_sdl3 test_pad_sdl3

      - name: Test SDL audio and input seams
        shell: msys2 {0}
        run: >-
          ctest --test-dir prosper/build-windows-app --output-on-failure --timeout 600
          -R '^(prosper_app_pad_overlay|audio_sdl3|pad_sdl3)$'

      - name: Verify portable runtime imports
        shell: msys2 {0}
        run: |
          deps="$(objdump -p prosper/build-windows-app/prosper-app.exe | sed -n 's/.*DLL Name: //p')"
          printf '%s\n' "$deps"
          if grep -Eiq 'lib(gcc|stdc\+\+|winpthread)|SDL3' <<<"$deps"; then
            echo 'prosper-app unexpectedly depends on a MinGW or SDL runtime DLL' >&2
            exit 1
          fi

      - name: Package Windows app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'prosper-windows-x64'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'prosper-windows-x64.zip'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'prosper/build-windows-app/prosper-app.exe' $stage
          Copy-Item 'prosper/scripts/start-prosper.ps1' $stage
          Copy-Item 'prosper/docs/WINDOWS_RELEASE.md' (Join-Path $stage 'README.md')
          @(
            'prosper Windows x64'
            "commit: $env:GITHUB_SHA"
            "workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content (Join-Path $stage 'BUILD.txt') -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  prosper-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Upload Windows app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: prosper-windows-x64
          path: |
            prosper-windows-x64.zip
            prosper-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (x86_64 / Rosetta 2)
    runs-on: macos-latest

    # GitHub's macos-latest runners are Apple Silicon (arm64). prosper has no ARM CPU backend — it
    # runs the guest's x86-64 code natively — so the whole app is built x86_64 (CMAKE_OSX_ARCHITECTURES)
    # and its tests run under Rosetta 2, exactly the supported macOS configuration (see docs/PORTING.md).
    # This exercises the Darwin guest-execution substrate (src/host/posix_shim.hpp), not just a compile.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # Rosetta 2 is not preinstalled on arm64 runners; it's needed to RUN the x86_64 ctest binaries
        # (building them is a normal cross-arch target and needs no translation).
        # spirv-tools: the `spv_validate` test runs on every platform and requires spirv-val (see
        # the Linux job's dependency note). The validator is invoked as a subprocess, so the
        # native arm64 build serves the x86_64 test binaries fine.
        run: |
          brew install ninja spirv-tools
          softwareupdate --install-rosetta --agree-to-license

      - name: Configure
        # Vulkan is disabled (Homebrew's loader is arm64-only; the headless core + substrate tests
        # don't need it — MoltenVK is a later frontier). x86_64 target, run under Rosetta.
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE

      - name: Build
        run: cmake --build prosper/build-ci

      - name: Test
        run: ctest --test-dir prosper/build-ci --output-on-failure --timeout 600

  macos-app:
    name: macOS App (SDL3 + MoltenVK)
    runs-on: macos-latest

    # Builds the realtime window frontend (prosper-app) x86_64 against a UNIVERSAL MoltenVK, so the
    # SDL3-window/MoltenVK-present glue and the frontends stay compiling on a real macOS toolchain.
    # Build-only: the window needs a display and headless Metal is flaky on CI runners, so it isn't
    # run here (locally on an M2, --test-pattern presents fine and the offscreen GPU tests pass 90/91
    # -- see docs/PORTING.md "The macOS harness app"). Mirrors the Linux App job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ninja vulkan-headers
          softwareupdate --install-rosetta --agree-to-license

      - name: Fetch universal MoltenVK
        # Homebrew's MoltenVK is arm64-only; the x86_64 app needs a universal driver.
        run: bash prosper/scripts/fetch-macos-vulkan.sh

      - name: Configure
        run: cmake -S prosper -B prosper/build-app -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=x86_64 -DPROSPER_APP=ON -DPROSPER_AUDIO_SDL3=ON -DPROSPER_PAD_SDL3=ON -DPROSPER_MACOS_MOLTENVK=${{ github.workspace }}/.macos-vulkan/lib/libMoltenVK.dylib

      - name: Build prosper-app
        run: cmake --build prosper/build-app --target prosper-app

  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-app, linux-app-package, windows-mingw, windows-app, macos, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: prosper-windows-x64
          path: release-assets

      # Same directory as the Windows assets: the publish step below uploads release-assets/*, so a
      # platform is released exactly when its archives land here.
      - name: Download Linux archives
        uses: actions/download-artifact@v4
        with:
          name: prosper-linux-x86_64
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "prosper $GITHUB_REF_NAME"
          fi
