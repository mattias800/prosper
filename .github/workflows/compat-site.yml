name: Compat site

# Static per-title compatibility page (shadPS4/AnyPS5-roadmap shape): search, rung-status
# filters and a no-JS fallback, generated OFFLINE from the committed PROGRESS_TRACKER.md
# and COMPATIBILITY.md -- so the page is exactly as current as those files and needs no
# token. The trackers stay authoritative over every row.
#
# Enable once under Settings -> Pages -> Build and deployment -> GitHub Actions; the
# deployed URL is https://mattias800.github.io/prosper/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compat-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the generator still discriminates
        run: python3 prosper/tools/compat_site/gen_compat_site.py --selftest

      - name: Build the static site
        run: python3 prosper/tools/compat_site/gen_compat_site.py out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
