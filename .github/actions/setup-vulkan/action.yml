name: Vulkan 1.4 toolchain
description: Build matching pinned Khronos headers, loader and validation layer while retaining the runner's Mesa driver.
runs:
  using: composite
  steps:
    - name: Identify the build distribution
      id: host
      shell: bash
      run: |
        . /etc/os-release
        printf 'distribution=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"

    - name: Cache the matching Vulkan toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/prosper-vulkan
        key: vulkan-1.4.350-vvl-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.distribution }}-3

    - name: Build headers, loader and validation layer
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get install -y libx11-dev libxcb1-dev libxrandr-dev libwayland-dev
        vulkan_root="$RUNNER_TEMP/prosper-vulkan-build"
        vulkan_prefix="$RUNNER_TEMP/prosper-vulkan"
        mkdir -p "$vulkan_root/tmpdir"
        export TMPDIR="$vulkan_root/tmpdir"
        cd "$vulkan_root"
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/Vulkan-Headers/tar.gz/refs/tags/v1.4.350 \
          --output headers.tar.gz
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/Vulkan-Loader/tar.gz/refs/tags/v1.4.350 \
          --output loader.tar.gz
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/Vulkan-ValidationLayers/tar.gz/refs/tags/v1.4.350 \
          --output validation.tar.gz
        # The embedded SPIR-V parser must match VVL, not the distro's older library.
        # These are VVL v1.4.350's scripts/known_good.json production dependencies.
        # This release also fixes 3D-image layout tracking through 2D-array views.
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/Vulkan-Utility-Libraries/tar.gz/refs/tags/v1.4.350 \
          --output utility.tar.gz
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/SPIRV-Headers/tar.gz/ad9184e76a66b1001c29db9b0a3e87f646c64de0 \
          --output spirv-headers.tar.gz
        curl --fail --location --retry 3 \
          https://codeload.github.com/KhronosGroup/SPIRV-Tools/tar.gz/6c0666ec2000ba74ed12df5f6e807a7f721402a1 \
          --output spirv-tools.tar.gz
        printf '%s\n' \
          '6dd105e5cc7ddab6e7b611ae2c1872740d1727557cc8bf9daf13d6de1e4b3999  headers.tar.gz' \
          'fe472f15c49b1915137c065d997dbce86e31750f5bfb56c5c9a3b5b4919e44eb  loader.tar.gz' \
          '4fb9f0c72d840d2d2afd7b085891cd8ec1e74f8f3667d7683910890716e112ca  validation.tar.gz' \
          '92a2bccf92da7b4b4d2b2d29bdceae2061f83adcec9fd0ea6fd28f14f0f9f4da  utility.tar.gz' \
          'b5b7eba62453eb8c6f6a5fbf7155b71cde693bafe9cd5f03b79ed8c714816afe  spirv-headers.tar.gz' \
          'a9af63165d0adc84fa45b0e86c6f738fe7ca66a7955c13152f28002706436310  spirv-tools.tar.gz' \
          | sha256sum --check
        tar -xzf headers.tar.gz
        tar -xzf loader.tar.gz
        tar -xzf validation.tar.gz
        tar -xzf utility.tar.gz
        tar -xzf spirv-headers.tar.gz
        tar -xzf spirv-tools.tar.gz
        cmake -S Vulkan-Headers-1.4.350 -B headers-build -G Ninja \
          -DCMAKE_INSTALL_PREFIX="$vulkan_prefix"
        cmake --install headers-build
        cmake -S Vulkan-Loader-1.4.350 -B loader-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$vulkan_prefix" \
          -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH="$vulkan_prefix" \
          -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF
        cmake --build loader-build --parallel 2
        cmake --install loader-build
        cmake -S SPIRV-Headers-ad9184e76a66b1001c29db9b0a3e87f646c64de0 -B spirv-headers-build -G Ninja \
          -DCMAKE_INSTALL_PREFIX="$vulkan_prefix"
        cmake --install spirv-headers-build
        cmake -S SPIRV-Tools-6c0666ec2000ba74ed12df5f6e807a7f721402a1 -B spirv-tools-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$vulkan_prefix" \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DSPIRV-Headers_SOURCE_DIR="$vulkan_root/SPIRV-Headers-ad9184e76a66b1001c29db9b0a3e87f646c64de0" \
          -DSPIRV_WERROR=OFF -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=OFF
        cmake --build spirv-tools-build --parallel 2
        cmake --install spirv-tools-build
        cmake -S Vulkan-Utility-Libraries-1.4.350 -B utility-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$vulkan_prefix" \
          -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH="$vulkan_prefix" \
          -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF
        cmake --build utility-build --parallel 2
        cmake --install utility-build
        cmake -S Vulkan-ValidationLayers-1.4.350 -B validation-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$vulkan_prefix" \
          -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH="$vulkan_prefix" \
          -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF
        cmake --build validation-build --parallel 2
        cmake --install validation-build

    - name: Select the Vulkan toolchain
      shell: bash
      run: |
        vulkan_prefix="$RUNNER_TEMP/prosper-vulkan"
        # Refuse a partial or old cache instead of silently discovering the system layer.
        python3 - "$vulkan_prefix" <<'PY'
        import json
        import pathlib
        import sys
        prefix = pathlib.Path(sys.argv[1])
        manifest = prefix / "share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
        layer = json.loads(manifest.read_text())["layer"]
        if (layer["name"] != "VK_LAYER_KHRONOS_validation" or
            layer["api_version"] != "1.4.350" or
            layer["library_path"] != "libVkLayer_khronos_validation.so" or
            not (prefix / "lib" / layer["library_path"]).is_file()):
            raise SystemExit("Pinned Vulkan validation layer is missing or mismatched")
        print(f"Selected validation manifest: {manifest}; API {layer['api_version']}")
        PY
        sha256sum "$vulkan_prefix/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
          "$vulkan_prefix/lib/libVkLayer_khronos_validation.so"
        printf 'VULKAN_SDK=%s\n' "$vulkan_prefix" >> "$GITHUB_ENV"
        printf 'LD_LIBRARY_PATH=%s/lib%s\n' "$vulkan_prefix" \
          "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        printf 'VK_LAYER_PATH=%s/share/vulkan/explicit_layer.d\n' "$vulkan_prefix" >> "$GITHUB_ENV"
