# prosper Python tooling (prosper/tools, prosper/tests, prosper/scripts).
#
# Managed with uv: `uv sync --group dev` installs pytest, pytest-cov and ruff pinned by uv.lock.
# ctest still drives the stdlib-unittest/selftest cases through add_test; this file adds nothing
# those need. Ruff is gated on CHANGED files only (prosper/tools/ci/check_python_quality.py), so the
# existing tree is not reformatted wholesale.

[project]
name = "prosper-tools"
version = "0.1.0"
description = "Python tooling and self-tests for prosper"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]
# C++ lint, gated on CHANGED LINES only (prosper/tools/ci/check_cpp_lint.py). Exact pins: a new
# clang-tidy release adds checks and changes findings, so an unpinned version would move the gate
# under every PR at once. Bump deliberately, in its own PR. `uv sync --group cpp-lint`.
cpp-lint = [
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D100"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# pytest collects only the files that are real unittest/pytest tests AND pass on a clean host.
# Measured 2026-10-02 over the 77 test_*.py files: 12 collect tests, 40 are script-style (ctest runs
# them as programs and pytest collects nothing), 25 fail at import (module-level sys.exit / missing
# build output). ctest stays the source of truth for the rest; widen this list as files are converted.
# Since then a `pythonpath` entry made 8 more import (see below). test_schedstat_probe.py was left out
# as flaky until #4142 drove its fixture from a virtual clock; it is collected again.
# Left out although collected: tools/test_lanekill.py (7 errors on this host) and
# tools/test_session_start.py (passes, but 71 s).
testpaths = [
    "prosper/tools/revision/test_compiler_wrapper.py",
    "prosper/tests/tools/test_dump_hygiene.py",
    "prosper/tools/ci",
    "prosper/tools/doctor/test_doctor.py",
    "prosper/tools/docs/test_check_arch_docs.py",
    "prosper/tools/docs/test_check_doc_meta.py",
    "prosper/tools/screenshots/test_check_screenshot_paths.py",
    "prosper/tools/env/test_check_switch_registry.py",
    "prosper/tools/docs/test_confidence_ledger.py",
    "prosper/tools/perf/test_compare_capture_pair.py",
    "prosper/tools/perf/test_perf_caller_report.py",
    "prosper/tools/perf/test_perf_f8_gap.py",
    "prosper/tools/perf/test_performance_capture_report.py",
    "prosper/tools/perf/test_schedstat_f8.py",
    "prosper/tools/perf/test_schedstat_probe.py",
    "prosper/tools/pixel_history/test_pixel_history.py",
    "prosper/tools/gpu_replay/test_regress.py",
    "prosper/tools/guest_bt/test_guest_bt.py",
    "prosper/tools/hang_probe/test_hang_probe.py",
    "prosper/tools/il2cpp/test_il2cpp_tools.py",
    "prosper/tools/perf/test_stack_profile.py",
    "prosper/tools/re/test_hle_handler_map.py",
    "prosper/tools/snapshot/test_snapshot.py",
    "prosper/tools/test_worktree_reclaim.py",
    "prosper/tools/progress/test_progress.py",
]
# --import-mode=importlib does not put a test's folder on sys.path, and these tests import their
# sibling tool by bare name.
pythonpath = [
    "prosper/tools/docs",
    "prosper/tools/doctor",
    "prosper/tools/env",
    "prosper/tools/perf",
    "prosper/tools/pixel_history",
    "prosper/tools/progress",
    "prosper/tools/screenshots",
]
addopts = ["-p", "no:cacheprovider", "--import-mode=importlib"]